name: Construir y Actualizar Helm (GitOps)

on:
  push:
    branches:
      - helm
    paths-ignore:
      - 'helm-chart/values.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fabiocubas101/tfm-ai-api
  ARGOCD_APP_NAME: tfm-ai-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GitHub CR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-gitops:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: helm

      - name: Extraer Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Actualizar tag en values.yaml
        run: |
          sed -i 's/tag: ".*"/tag: "sha-${{ steps.vars.outputs.sha_short }}"/g' helm-chart/values.yaml

      - name: Commit y Push de la nueva versión a Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-chart/values.yaml
          git commit -m "chore: actualizar imagen a la versión sha-${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push

  deploy-secrets:
    runs-on: ubuntu-latest
    needs: update-gitops
    steps:
      - name: Inyectar Secretos en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY_PROD }}
          script: |
            kubectl create secret generic tfm-ai-api-secrets \
              --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --from-literal=MASTER_API_KEY="${{ secrets.MASTER_API_KEY }}" \
              -n tfm-ai-api \
              --dry-run=client -o yaml | kubectl apply -f -

  sync-argocd:
    runs-on: ubuntu-latest
    needs: deploy-secrets
    steps:
      - name: Instalar ArgoCD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd

      - name: Sincronizar y Esperar en ArgoCD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          
          echo "Sincronizando la aplicación en ArgoCD..."
          argocd app sync ${{ env.ARGOCD_APP_NAME }} \
            --grpc-web \
            --server $ARGOCD_SERVER \
            --auth-token $ARGOCD_TOKEN \
          
          echo "Esperando a que la aplicación esté Healthy..."
          argocd app wait ${{ env.ARGOCD_APP_NAME }} \
            --grpc-web \
            --server $ARGOCD_SERVER \
            --auth-token $ARGOCD_TOKEN \
            --health